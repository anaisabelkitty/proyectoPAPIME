[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
monitor_filters = direct
build_src_filter = +<*> -<esp32_pruebas/> -<mega_pruebas/>
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

[env:mega-wifi-ble-prueba]
; Prueba completa BLE + WiFi + UART (ver docs/prueba_wifi_ble_esp32_mega.md)
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
monitor_filters = direct
build_src_filter = -<*> +<mega_pruebas/wifi_ble_uart_prueba.cpp>

[env:mega-uart-prueba]
; Prueba de comunicación UART con la ESP32 (ver docs/prueba_uart_esp32_mega.md)
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
monitor_filters = direct
build_src_filter = -<*> +<mega_pruebas/uart_prueba.cpp>

[env:esp32-c6-uart-prueba]
; ESP32-C6 (Waveshare ESP32-C6-DEV-KIT-N8). Se usa la plataforma pioarduino
; porque la de PlatformIO todavía no soporta bien el C6.
; El monitor sale por el USB nativo para dejar UART0 (GPIO16/17) libre para el Mega.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_pruebas/uart_prueba.cpp>

[env:esp32-c6-wifi-ble-prueba]
; Igual que esp32-c6-uart-prueba, pero con BLE + WiFi + WebSocket + puente UART.
; El módulo N8 trae 8 MB de flash; la tabla por defecto deja la app en 1.25 MB
; y NimBLE + WiFi + servidor async no caben. default_8MB.csv da 3.3 MB de app.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_pruebas/wifi_ble_uart_prueba.cpp>
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.0
    ESP32Async/AsyncTCP @ ^3.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
